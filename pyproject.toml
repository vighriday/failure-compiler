[project]
name = "failure-compiler"
version = "0.1.0"
description = "A crash-test tool for plans"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "ortools>=9.15,<9.16",
    "python-dotenv>=1.1",
    "groq>=0.25",
    "google-genai>=1.14",
    # Security floor for the CA bundle used by provider HTTP clients.
    "certifi>=2026.10.19",
]

# Compatibility aliases for earlier setup commands. Live AI is a runtime
# feature; the standard uv sync also installs the default dev group below.
[project.optional-dependencies]
ai = []
dev = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8.3",
    "ruff>=0.11",
    "httpx>=0.28",
]
